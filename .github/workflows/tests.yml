name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements.txt pytest pytest-asyncio

      # No secrets needed: conftest stubs config.py when it is absent.
      - run: pytest -q
